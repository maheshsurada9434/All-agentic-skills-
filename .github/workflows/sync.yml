name: Sync skills and publish
on:
  schedule:
    - cron: '23 3 * * 1'   # every Monday, 08:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sources.json', 'scripts/**', 'skills/mahesh-surada/**', 'index.html', '.github/workflows/sync.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull every skill from the sources
        run: node scripts/sync.mjs
      - name: Save the updated catalog
        run: |
          git config user.name "Mahesh Surada"
          git config user.email "36591838+maheshsurada9434@users.noreply.github.com"
          git add -A skills catalog README.md
          git diff --cached --quiet || (git commit -m "Weekly skills sync $(date -u +%F)" && git pull --rebase && git push)
      - name: Build the website
        run: mkdir _site && cp -r index.html catalog install.sh _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
